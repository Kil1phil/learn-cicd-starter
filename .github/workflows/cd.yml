name: cd

on:
  push:
    branches: [main]

jobs:
  tests:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"

      - name: Build
        run: ./scripts/buildprod.sh

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v3'

      - name: 'Use gcloud CLI'
        run: 'gcloud builds submit --tag europe-west10-docker.pkg.dev/notely-486711/notely-ar-repo/notely:v1 .'

      - name: Deploy to Cloud Run
        run: 'gcloud run deploy notely --image europe-west10-docker.pkg.dev/notely-486711/notely-ar-repo/notely:v1 --region europe-west10-docker --allow-unauthenticated --project notely-486711 --max-instances=4'
